<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 512px;
        height: 512px;
        overflow: hidden;
        font-family: "Inter", -apple-system, sans-serif;
        background: transparent;
      }
      .stage {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #0a0a0a 0%, #16213e 100%);
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 70% 60% at 25% 25%, rgba(37, 99, 235, 0.45), transparent 60%),
          radial-gradient(ellipse 60% 50% at 80% 80%, rgba(2, 132, 199, 0.30), transparent 60%);
      }
      .qv {
        position: relative;
        z-index: 1;
        font-size: 320px;
        font-weight: 800;
        letter-spacing: -16px;
        line-height: 1;
        color: #ffffff;
        background: linear-gradient(135deg, #ffffff 0%, #cfe2ff 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        padding-right: 12px;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="glow"></div>
      <div class="qv">QV</div>
    </div>
  </body>
</html>
